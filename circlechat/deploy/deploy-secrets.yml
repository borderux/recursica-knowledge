# Copy to .github/workflows/deploy-secrets.yml in the private repo that holds each stack's
# site.json. The workflow writes one stack's secrets to one computer, then restarts what reads
# them. See circlechat/README.md in recursica-knowledge, "Secrets in GitHub".
#
# Each stack is a GitHub environment: the cluster's own stack's name (site.stack_name, "cluster"
# when unset), or "client-<name>". Put each secret in that environment, and require an approval
# before a workflow uses the environment.
name: Deploy secrets

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack: the cluster's own stack (site.stack_name, cluster when unset), or client-<name>"
        required: true
      computer:
        description: "Computer name from the stack's site.json"
        required: true
      restart:
        description: "Restart the services that read the secrets"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.computer }}"]
    environment: ${{ inputs.stack }}
    steps:
      - name: Write the secrets
        env:
          STACK: ${{ inputs.stack }}
          COMPUTER: ${{ inputs.computer }}
          RESTART: ${{ inputs.restart }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_TOKEN }}
          APPROVERS: ${{ secrets.APPROVERS }}
          # Every secret in the environment, so each approver's TOTP_SECRET_<NAME>, each cloud key's
          # MODEL_KEY_<NAME> and each agent's APP_KEY_<AGENT> arrive without naming the
          # approvers, the keys or the agents here.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          KEV_ENGINE_KEY: ${{ secrets.KEV_ENGINE_KEY }}
          KEV_API_KEY: ${{ secrets.KEV_API_KEY }}
          JOBD_TOKEN: ${{ secrets.JOBD_TOKEN }}
          PORTER_HOOK_URL: ${{ secrets.PORTER_HOOK_URL }}
          PORTER_HOOK_SECRET: ${{ secrets.PORTER_HOOK_SECRET }}
          PORTER_GIT_NAME: ${{ secrets.PORTER_GIT_NAME }}
          PORTER_GIT_EMAIL: ${{ secrets.PORTER_GIT_EMAIL }}
          KEV_DATA_GITHUB_PAT: ${{ secrets.KEV_DATA_GITHUB_PAT }}
          # The agent check's own CircleChat account (kit/check-account.mjs), on one line.
          CC_CHECK_PASSWORD: ${{ secrets.CC_CHECK_PASSWORD }}
        # bash and sed only: the computers' runners may have no jq. toJSON prints one "KEY": "value"
        # pair per line. A TOTP secret's value holds only A-Z, 2-7 and =. A cloud key's value holds
        # letters, digits and - _ . : / + = only, so no JSON escape can appear in one. A GitHub App's
        # private key holds base64, spaces, dashes and line breaks, which toJSON prints as \n. The
        # helper turns each \n back into a line break.
        run: |
          {
            printenv | grep -E '^[A-Z][A-Z0-9_]*=' | grep -v '^ALL_SECRETS='
            printf '%s\n' "$ALL_SECRETS" \
              | sed -nE -e 's/^[[:space:]]*"(TOTP_SECRET_[A-Z0-9_]+)": "([A-Z2-7=]+)",?[[:space:]]*$/\1=\2/p' \
                       -e 's|^[[:space:]]*"(MODEL_KEY_[A-Z0-9_]+)": "([A-Za-z0-9._:/+=-]+)",?[[:space:]]*$|\1=\2|p' \
                       -e 's|^[[:space:]]*"(APP_KEY_[A-Z0-9_]+)": "(-----BEGIN [A-Z ]*PRIVATE KEY-----[-A-Za-z0-9+/= \\]+)",?[[:space:]]*$|\1=\2|p'
          } | sudo -n /usr/local/bin/agent-stacks-apply "$STACK" "$COMPUTER" "$RESTART"
