# macOS (pf) lockdown: the base rules, then refuse every outgoing connection except to Tailscale,
# HTTPS on port 443 (Slack, Tailscale's relays) and name lookups.
table <blocked> persist
block in log quick from <blocked>
pass in quick on lo0 all
pass in quick inet from 100.64.0.0/10
pass in quick inet6 from fd7a:115c:a1e0::/48
pass in quick proto udp to port 41641
block in log all
pass out quick on lo0 all
pass out quick inet to 100.64.0.0/10 keep state
pass out quick inet6 to fd7a:115c:a1e0::/48 keep state
pass out quick proto tcp to port 443 keep state
pass out quick proto udp to port { 53 41641 3478 } keep state
block out log all
