# macOS (pf) lockdown: the base rules, then refuse every outgoing connection except to Tailscale,
# HTTPS on port 443 (Slack, Tailscale's relays) and name lookups. pf never filters loopback (lo0).
# As in pf-base.conf, a packet that claims a Tailscale address on a physical interface is refused,
# and Tailscale's addresses then pass with no interface named, both in and out. Tailscale's route
# sends every packet for a Tailscale address through Tailscale's interface.
physical_if = "{ en0 en1 en2 en3 en4 en5 en6 en7 en8 en9 en10 en11 en12 en13 en14 en15 en16 en17 en18 en19 en20 en21 en22 en23 en24 en25 en26 en27 en28 en29 en30 en31 bridge0 bridge1 bridge2 bridge3 bridge4 bridge5 bridge6 bridge7 bridge100 bridge101 bridge102 bridge103 bridge104 bridge105 bridge106 bridge107 awdl0 llw0 ap1 }"
table <blocked> persist
block in log quick from <blocked>
block in log quick on $physical_if inet from 100.64.0.0/10
block in log quick on $physical_if inet6 from fd7a:115c:a1e0::/48
pass in quick inet from 100.64.0.0/10
pass in quick inet6 from fd7a:115c:a1e0::/48
pass in quick proto udp to port 41641
block in log all
pass out quick inet to 100.64.0.0/10 keep state
pass out quick inet6 to fd7a:115c:a1e0::/48 keep state
pass out quick proto tcp to port 443 keep state
pass out quick proto udp to port { 53 41641 3478 } keep state
block out log all
