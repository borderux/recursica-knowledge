# macOS (pf) lockdown: the base rules, then refuse every outgoing connection except to Tailscale,
# HTTPS on port 443 (Slack, Tailscale's relays) and name lookups. pf never filters loopback (lo0),
# and Tailscale's addresses pass only on Tailscale's utun interface, as in pf-base.conf.
tailscale_if = "{ utun0 utun1 utun2 utun3 utun4 utun5 utun6 utun7 utun8 utun9 utun10 utun11 utun12 utun13 utun14 utun15 utun16 utun17 utun18 utun19 utun20 utun21 utun22 utun23 utun24 utun25 utun26 utun27 utun28 utun29 utun30 utun31 }"
table <blocked> persist
block in log quick from <blocked>
pass in quick on $tailscale_if inet from 100.64.0.0/10
pass in quick on $tailscale_if inet6 from fd7a:115c:a1e0::/48
pass in quick proto udp to port 41641
block in log all
pass out quick on $tailscale_if inet to 100.64.0.0/10 keep state
pass out quick on $tailscale_if inet6 to fd7a:115c:a1e0::/48 keep state
pass out quick proto tcp to port 443 keep state
pass out quick proto udp to port { 53 41641 3478 } keep state
block out log all
