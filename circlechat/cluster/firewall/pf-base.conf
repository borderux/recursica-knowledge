# macOS (pf): refuse each incoming connection, except from Tailscale and allowed sources, and
# except the decoy ports. Remote access (RustDesk) runs over Tailscale. Loaded into the "agentguard"
# anchor by install-cluster.sh, with @CANARY_PORTS@ filled in.
# pf never filters loopback (lo0): "set skip on lo0" in /etc/pf.conf (pf-main.sh), because pf takes
# no option inside an anchor. No rule here needs loopback.
# Tailscale's addresses pass only on Tailscale's interface, a utun interface. macOS has no interface
# groups, and Tailscale takes the first free utun number, so the list covers utun0 to utun31. An
# address from the office network that claims a Tailscale address arrives on another interface.
tailscale_if = "{ utun0 utun1 utun2 utun3 utun4 utun5 utun6 utun7 utun8 utun9 utun10 utun11 utun12 utun13 utun14 utun15 utun16 utun17 utun18 utun19 utun20 utun21 utun22 utun23 utun24 utun25 utun26 utun27 utun28 utun29 utun30 utun31 }"
table <blocked> persist
table <allowed> persist
block in log quick from <blocked>
pass in quick on $tailscale_if inet from 100.64.0.0/10
pass in quick on $tailscale_if inet6 from fd7a:115c:a1e0::/48
pass in quick from <allowed>
pass in quick proto udp to port 41641
pass in quick proto udp from port 67 to port 68
pass in quick proto tcp to port { @CANARY_PORTS@ }
pass in quick proto { icmp, icmp6 }
block in log all
pass out all keep state
