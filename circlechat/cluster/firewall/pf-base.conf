# macOS (pf): refuse each incoming connection, except from Tailscale and allowed sources, and
# except the decoy ports. Remote access (RustDesk) runs over Tailscale. Loaded into the "agentguard"
# anchor by install-cluster.sh, with @CANARY_PORTS@ and @RUSTDESK_DIRECT@ filled in (firewall/rules.sh).
# @RUSTDESK_DIRECT@ is empty, or a rule that refuses RustDesk's direct-address ports, 21118 and
# 21119, from everywhere (remote_access.direct_ip false). The rule comes before Tailscale's pass.
# pf never filters loopback (lo0): "set skip on lo0" in /etc/pf.conf (pf-main.sh), because pf takes
# no option inside an anchor. No rule here needs loopback.
# Tailscale's addresses, 100.64.0.0/10 and fd7a:115c:a1e0::/48, pass from Tailscale's utun
# interface, whatever its number. Tailscale takes the first free utun number at each start, so the
# pass names no interface: a rule that names utun interfaces can miss Tailscale's interface after a
# restart and cut off remote access. Instead, a packet that claims a Tailscale address on a physical
# interface is refused first: a forged source from the office network or from a nearby radio. A
# Tailscale address then passes only from a virtual interface, such as Tailscale's. macOS pf has no
# interface groups and no wildcards, so physical_if lists the names: en0 to en31 (Ethernet, Wi-Fi,
# and each Thunderbolt or USB port and adapter, which a Mac numbers past en10 already), bridge0 to
# bridge7 (Thunderbolt Bridge), bridge100 to bridge107 (the bridges macOS's virtual-machine
# networking makes, from 100), awdl0 and llw0 (Wi-Fi's peer-to-peer links, such as AirDrop's) and
# ap1 (Wi-Fi's access-point interface). pf takes a rule for an interface the Mac doesn't have.
physical_if = "{ en0 en1 en2 en3 en4 en5 en6 en7 en8 en9 en10 en11 en12 en13 en14 en15 en16 en17 en18 en19 en20 en21 en22 en23 en24 en25 en26 en27 en28 en29 en30 en31 bridge0 bridge1 bridge2 bridge3 bridge4 bridge5 bridge6 bridge7 bridge100 bridge101 bridge102 bridge103 bridge104 bridge105 bridge106 bridge107 awdl0 llw0 ap1 }"
table <blocked> persist
table <allowed> persist
block in log quick from <blocked>
@RUSTDESK_DIRECT@
block in log quick on $physical_if inet from 100.64.0.0/10
block in log quick on $physical_if inet6 from fd7a:115c:a1e0::/48
pass in quick inet from 100.64.0.0/10
pass in quick inet6 from fd7a:115c:a1e0::/48
pass in quick from <allowed>
pass in quick proto udp to port 41641
pass in quick proto udp from port 67 to port 68
pass in quick proto tcp to port { @CANARY_PORTS@ }
pass in quick proto { icmp, icmp6 }
block in log all
pass out all keep state
