# macOS (pf): refuse each incoming connection, except from the computer itself, Tailscale and
# allowed sources, and except Splashtop's port and the decoy ports. Loaded into the "agentguard"
# anchor by install-cluster.sh, with @CANARY_PORTS@ and @SPLASHTOP_PORT@ filled in.
table <blocked> persist
table <allowed> persist
block in log quick from <blocked>
pass in quick on lo0 all
pass in quick inet from 100.64.0.0/10
pass in quick inet6 from fd7a:115c:a1e0::/48
pass in quick from <allowed>
pass in quick proto udp to port 41641
pass in quick proto udp from port 67 to port 68
pass in quick proto tcp to port { @SPLASHTOP_PORT@ @CANARY_PORTS@ }
pass in quick proto { icmp, icmp6 }
block in log all
pass out all keep state
